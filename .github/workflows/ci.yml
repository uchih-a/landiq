name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check backend/ src/
      - run: uv run ruff format --check backend/ src/

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # Lenient: don't fail the build on type errors yet
      - run: uv run mypy backend/app/ --ignore-missing-imports || true

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - env:
          PYTHONPATH: backend:src
        run: uv run python -m pytest backend/tests/ -v

  openapi-snapshot:
    name: OpenAPI snapshot diff (B10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - env:
          PYTHONPATH: backend:src
        name: Check OpenAPI snapshot matches committed version
        run: uv run python scripts/check_openapi_snapshot.py

  container-build-and-health:
    name: Container build + health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t landval-api:ci .
      - name: Run container and check /health
        run: |
          docker run -d --name landval-test -p 8000:8000 \
            -e APP_ENV=production \
            -e ARTIFACTS_DIR=/app/artifacts \
            landval-api:ci
          sleep 5
          # The app starts in degraded mode (no artifacts in CI), but
          # /health must still respond 200 with status: "degraded".
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /health returned $STATUS (expected 200)"
            docker logs landval-test
            docker rm -f landval-test
            exit 1
          fi
          BODY=$(curl -s http://localhost:8000/api/v1/health)
          echo "Health response: $BODY"
          docker rm -f landval-test
